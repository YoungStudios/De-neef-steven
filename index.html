<style>
:root{--bg:#FAF7F2;--white:#FFF;--sand:#F1ECE3;--green:#2B3E34;--green-dark:#1E2C25;--dark:#1C1B19;--muted:#4E4A44;--gold:#8A662B;--line:#E5DEC9}

html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark);line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.w{max-width:1060px;margin:0 auto;padding:0 22px}

.brand{font-size:1.38rem;color:var(--green);text-decoration:none;letter-spacing:.3px}
.menu{display:flex;gap:26px;align-items:center}
.menu a.lnk{text-decoration:none;color:var(--muted);font-size:.93rem;font-weight:500;transition:color .2s}
.menu a.lnk:hover{color:var(--green)}
.btn{display:inline-block;background:var(--green);color:#fff;padding:13px 28px;border-radius:6px;text-decoration:none;font-weight:600;font-size:.94rem;transition:background .2s}
.btn:hover{background:var(--green-dark)}
.btn-s{padding:9px 18px;font-size:.88rem}
.hero{padding:72px 0 64px;background:linear-gradient(180deg,#FFF 0%,var(--bg) 100%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.tag{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:.76rem;font-weight:700;display:block;margin-bottom:12px}
.hero h1{font-size:2.55rem;line-height:1.18;margin-bottom:18px;color:var(--dark)}
.hero p{color:var(--muted);font-size:1.05rem;margin-bottom:30px;max-width:500px}
.hero-frame{width:100%;height:380px;border-radius:14px;background:var(--sand);border:1px solid var(--line);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.05)}
.hero-frame img{width:100%;height:100%;object-fit:cover;display:block}
.notice{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:22px 26px;margin-bottom:40px}
.notice h2{font-size:1.15rem;color:var(--green);margin-bottom:4px}
.notice p{font-size:.94rem;color:var(--muted)}
.notice a{color:var(--green);font-weight:600;text-decoration:underline}
.sec{padding:64px 0}
.sec-w{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{text-align:center;margin-bottom:44px}
.head h2{font-size:2.05rem;margin-bottom:10px;color:var(--dark)}
.head p{color:var(--muted);max-width:560px;margin:0 auto;font-size:.97rem}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:28px}
.card span{color:var(--gold);font-size:.82rem;font-weight:700;letter-spacing:1.2px}
.card h3{font-size:1.22rem;color:var(--green);margin:6px 0 10px}
.card p{font-size:.93rem;color:var(--muted)}
.plist{max-width:740px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 30px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);gap:16px}
.prow:last-child{border-bottom:none}
.pname{font-weight:600;display:block;font-size:1rem;color:var(--dark)}
.pdesc{font-size:.86rem;color:var(--muted)}
.pval{font-weight:700;color:var(--green);background:var(--white);border:1px solid var(--line);padding:5px 14px;border-radius:6px;font-size:.85rem;white-space:nowrap}
.quote-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:34px;text-align:center;max-width:740px;margin:0 auto}
.stars{color:var(--gold);font-size:1.15rem;letter-spacing:3px;margin-bottom:12px}
.quote-box blockquote{font-size:1.15rem;color:var(--dark);margin-bottom:12px;font-style:italic}
.quote-box cite{font-style:normal;font-size:.88rem;color:var(--muted);font-weight:600}

.faq summary{font-weight:600;color:var(--green);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.25rem;color:var(--gold);font-weight:700}
